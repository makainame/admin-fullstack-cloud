name: Deploy to Aliyun Server
name: Deploy to Aliyun Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 拉取最新代码
        run: |
          cd /root/project
          git pull origin main

      - name: 写入后端环境变量
        run: |
          cat > /root/project/backend/.env <<'ENV'
          DB_HOST=db
          DB_PORT=3306
          DB_USER=admin_user
          DB_PASSWORD=Admin@2026
          DB_NAME=admin_db
          JWT_SECRET_KEY=admin_2026_secret_888
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_HOUR=2
          SERVER_HOST=0.0.0.0
          SERVER_PORT=8000
          ENV

      - name: 停止旧容器并释放端口
        run: |
          docker stop fastapi-admin vue-front mariadb-admin 2>/dev/null || true
          docker rm fastapi-admin vue-front mariadb-admin 2>/dev/null || true

      - name: 构建并启动全栈服务
        run: |
          cd /root/project
          docker compose -f docker-compose-all.yml down 2>/dev/null || true
          docker compose -f docker-compose-all.yml up -d --build

      - name: 初始化测试数据
        run: |
          sleep 15
          cd /root/project/backend
          docker exec fastapi-admin python seed_data.py || true

      - name: 查看运行状态
        run: |
          docker ps
          cd /root/project && docker compose -f docker-compose-all.yml logs --tail=20
